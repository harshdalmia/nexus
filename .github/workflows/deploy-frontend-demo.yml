name: Deploy frontend demo

# Publishes the frontend to GitHub Pages as a standalone demo: no engine behind
# it, bundled data, labelled as demo data in the UI.
#
# Enable once under Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A superseded deploy is cancelled rather than queued behind the newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Fails the deploy on a type error rather than shipping a broken bundle.
      - run: npm run typecheck

      - name: Build demo bundle
        # A project site is served from /<repo>/, so assets need that prefix.
        env:
          VITE_BASE_PATH: ${{ github.event.repository.name }}
        run: npm run build:demo

      # Pages serves 404.html for unknown paths; pointing it at the app keeps a
      # refresh on any URL working.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
