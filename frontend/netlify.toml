# Netlify deploys the demo build by default: no engine, bundled data, labelled as
# demo in the UI. To deploy against a live engine instead, override the build
# command to `npm run build` and set VITE_API_BASE_URL in the site environment.

[build]
  base = "frontend"
  command = "npm run build:demo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single route ('/'), but the catch-all keeps a refresh on any path working and
# leaves room for deep links later.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
